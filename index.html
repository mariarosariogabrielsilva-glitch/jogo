<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Arcade do Aprendiz – Jogos para crescer na carreira</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece9ff;--card:#fff;--ink:#1b1340;--mut:#5d5688;--bd:#1b1340;--sh:#1b1340;--brand:#6c3bff;--sun:#ffd23f;--ok:#19c37d;--bad:#ff5d73;--meh:#ff9f1c;--soft:#f4f1ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f2e;--card:#211848;--ink:#f1edff;--mut:#b2a9e0;--bd:#4b3b99;--sh:#0b0720;--brand:#9a7bff;--soft:#2b2060}}
:root[data-theme="dark"]{--bg:#150f2e;--card:#211848;--ink:#f1edff;--mut:#b2a9e0;--bd:#4b3b99;--sh:#0b0720;--brand:#9a7bff;--soft:#2b2060}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,b.f{font-family:Fredoka,system-ui,sans-serif}
h1,h2{margin:0;line-height:1.15}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font:700 20px Fredoka,sans-serif}
.card{background:var(--card);border:3px solid var(--bd);border-radius:22px;box-shadow:5px 5px 0 var(--sh);padding:20px}
button{font:inherit;color:inherit}
.btn{font:600 18px Fredoka,sans-serif;background:var(--brand);color:#fff;border:3px solid var(--bd);border-radius:16px;padding:12px 26px;cursor:pointer;box-shadow:0 5px 0 var(--sh);transition:transform .1s,box-shadow .1s}

.btn.y{background:var(--sun);color:#1b1340}
.sm{font:600 14px Figtree,sans-serif;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hero{background:linear-gradient(135deg,#6c3bff,#2f80ff);color:#fff;text-align:center;padding:30px 20px}
.hero h1{font-size:clamp(32px,8vw,48px);margin-bottom:10px}
.hero p{margin:0 auto;max-width:46ch;font-size:17px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}
.how div{background:var(--soft);border:2px solid var(--bd);border-radius:16px;padding:12px;font-size:14.5px}
.how b{display:block;font:600 16px Fredoka,sans-serif}
.avs{display:flex;gap:10px;justify-content:center;margin:12px 0}
.avs button{font-size:36px;background:var(--soft);border:3px solid transparent;border-radius:16px;padding:4px 10px;cursor:pointer}
.avs button[aria-pressed=true]{border-color:var(--brand);background:var(--sun)}
input{font:inherit;width:100%;max-width:340px;display:block;margin:0 auto 16px;text-align:center;padding:11px;border-radius:14px;border:3px solid var(--bd);background:var(--card);color:var(--ink)}
.ctr{text-align:center}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px}
.me{display:flex;gap:10px;align-items:center}.av{font-size:34px}.me small{display:block;color:var(--mut)}
.st{display:flex;gap:18px}.st small{display:block;color:var(--mut);font-size:12px}.st b{font:600 18px Fredoka,sans-serif}
.lad{display:flex;justify-content:space-between;gap:4px;margin:14px 0}
.rung{flex:1;text-align:center;opacity:.45;transition:.3s}
.rung span{display:block;font-size:26px;filter:grayscale(1)}
.rung small{font-size:11px;line-height:1.1;display:block}
.rung.done,.rung.cur{opacity:1}.rung.done span,.rung.cur span{filter:none}
.rung.cur span{transform:scale(1.35);transition:.3s}.rung.cur small{font-weight:700;color:var(--brand)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:14px}
.m>div:first-child{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:12px;background:var(--soft);border:2px solid var(--bd);border-radius:9px;overflow:hidden;margin-top:3px}
.bar b{display:block;height:100%;transition:width .9s cubic-bezier(.3,1.4,.5,1)}
.sc .big{font-size:52px;line-height:1}.sc h2{font-size:24px;margin:8px 0 6px}.sc p{margin:0 0 14px;font-size:17px}
.ops{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:center;text-align:left;background:var(--soft);border:3px solid var(--bd);border-radius:16px;padding:12px 14px;cursor:pointer;font-weight:600;transition:transform .12s}
.op:hover:not(:disabled){transform:translateX(5px);background:var(--sun);color:#1b1340}
.op i{font:700 16px Fredoka,sans-serif;font-style:normal;background:var(--brand);color:#fff;border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center}
.op.dis{opacity:.5}.op.pick{opacity:1}.op.pick.q2{background:var(--ok);color:#fff}.op.pick.q1{background:var(--meh);color:#1b1340}.op.pick.q0{background:var(--bad);color:#fff}
.fb{margin-top:16px;border:3px solid var(--bd);border-radius:16px;padding:14px;background:var(--soft);animation:up .35s}
.fb h3{margin:0 0 4px;font:600 20px Fredoka,sans-serif}.fb p{margin:0 0 10px}
.chip{display:inline-block;font-weight:700;font-size:13.5px;border-radius:99px;padding:3px 11px;margin:0 6px 6px 0;color:#fff}
.chip.p{background:var(--ok)}.chip.n{background:var(--bad)}.chip.s{background:var(--brand)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.res h1{font-size:34px}.res .em{font-size:72px}
.tag{display:inline-block;background:var(--sun);color:#1b1340;font:700 22px Fredoka,sans-serif;border-radius:14px;padding:4px 18px;margin:8px 0}
.sec{margin-top:20px}.sec h3{font:600 18px Fredoka,sans-serif;margin:0 0 8px}
.les{background:var(--soft);border-left:6px solid var(--meh);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:15px}
.les b{display:block}
.pop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;background:var(--sun);color:#1b1340;border:3px solid var(--bd);padding:10px 22px;border-radius:99px;font:700 17px Fredoka,sans-serif;z-index:20;animation:pp 2.4s forwards;white-space:nowrap}
@keyframes pp{0%{opacity:0;transform:translate(-50%,-14px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.cf{position:fixed;top:-30px;font-size:26px;z-index:20;pointer-events:none;animation:cf 3s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(360deg)}}
body.big{zoom:1.25}
@media (prefers-reduced-motion:reduce){.cf{display:none}.fb,.pop{animation:none}.bar b,.op{transition:none}}
@media (max-width:480px){.mt{grid-template-columns:1fr}}
.gm{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.gc{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s;color:var(--ink)}
.gc:hover{transform:translate(-3px,-3px)}.gc span{font-size:44px;line-height:1}.gc small{color:var(--mut);font-size:15px}
.sm[aria-pressed=true]{background:var(--sun);color:#1b1340}

.slot{min-height:80px;text-align:left;background:var(--soft);border:3px solid var(--bd);border-radius:14px;padding:10px;cursor:pointer;color:var(--ink)}

.tray{display:flex;flex-wrap:wrap;gap:8px}

.piece.on{background:var(--sun);color:#1b1340;transform:translateY(-3px)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:14px auto}
.cell{aspect-ratio:1;font-size:44px;background:var(--soft);border:3px solid var(--bd);border-radius:14px;cursor:pointer}.cell.win{background:var(--ok)}
.tcs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tc{background:var(--soft);border:3px solid var(--bd);border-radius:18px;padding:10px;text-align:center}
.tc.w{background:var(--ok);color:#fff}.tc .e{font-size:42px;line-height:1.2}.tc small{display:block;font-size:12.5px;margin-top:6px}
.sr{display:flex;align-items:center;gap:6px;width:100%;background:none;border:2px solid transparent;border-radius:10px;padding:4px;font-size:12.5px;text-align:left;color:inherit}
.sr span{width:78px}.sr .bar{flex:1;margin:0;height:10px}.sr .bar b{background:var(--brand)}.sr:enabled{cursor:pointer}.sr.on{border-color:var(--brand);background:var(--card);color:var(--ink)}
.top{flex-wrap:wrap;gap:8px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:14px auto}
.mc{aspect-ratio:1;font:700 34px Fredoka,sans-serif;background:var(--brand);color:#fff;border:3px solid var(--bd);border-radius:14px;cursor:pointer;display:grid;place-items:center;padding:2px}
.mc.on{background:var(--soft);color:var(--ink)}.mc.ok{background:var(--ok);color:#fff}.mc b{font-size:13px;line-height:1.1}.pi{width:100%;height:100%;object-fit:cover;border-radius:10px}
.mail{background:var(--soft);border:3px solid var(--bd);border-radius:16px;padding:12px 16px;margin:12px 0;text-align:left}.mail p{margin:6px 0 0}
.tgt{font:700 56px Fredoka,sans-serif;color:var(--brand);margin:6px 0}
.bits{display:flex;gap:8px;justify-content:center;margin:10px 0}
.bit{width:58px;padding:8px 0;background:var(--soft);color:var(--ink);border:3px solid var(--bd);border-radius:14px;cursor:pointer;box-shadow:0 4px 0 var(--sh)}.bit span{font-size:30px;display:block}.bit.on{background:var(--sun);color:#1b1340}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:10px auto}
.kc{aspect-ratio:1;font-size:38px;background:var(--soft);border:3px solid var(--bd);border-radius:14px;cursor:pointer;box-shadow:0 4px 0 var(--sh)}.kc.bug{background:var(--sun)}.kc.fl{background:var(--brand)}
</style>
</head>

{e:"🚌",t:"Imprevisto no caminho",x:"O ônibus atrasou e você vai chegar 15 minutos depois do horário.",o:[["Aviso meu supervisor agora, explico e peço desculpas.",2,{r:12,c:8},"Avisar antes mostra responsabilidade e respeito."],["Chego e finjo que nada aconteceu.",1,{r:-6,p:-4},"Sem aviso, a equipe fica sem saber o que houve."],["Nem aviso. Ninguém vai perceber.",0,{r:-14,p:-8},"Atrasos sem aviso destroem a confiança rápido."]]},

{e:"📝",t:"Feedback do chefe",x:"Seu chefe mostra um erro numa planilha que você fez.",o:[["Agradeço, corrijo e anoto para não repetir.",2,{p:10,a:12},"Quem aceita feedback evolui mais rápido."],["Digo que a culpa foi de outra pessoa.",0,{p:-12,c:-6},"Culpar os outros afasta as chances de crescer."],["Fico de cara fechada o resto do dia.",1,{p:-6,c:-4},"Reação emocional atrapalha o clima e a sua imagem."]]},

];
var G;
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function newG(){G={scr:"start",nome:G?G.nome:"",av:G?G.av:AV[0],day:0,m:{c:25,p:25,r:25,a:25},pm:{c:25,p:25,r:25,a:25},pts:0,combo:0,order:[],oo:[0,1,2],ans:-1,hist:[],lv:0,gain:0,mu:1}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function avg(){return(G.m.c+G.m.p+G.m.r+G.m.a)/4}

 var sc=S[G.order[G.day]],o=sc.o[oi],q=o[1];
 G.ans=oi;G.pm=Object.assign({},G.m);

 if(G.day>=9){G.scr="end";if(G.pts>REC.pts){REC={pts:Math.round(G.pts),lv:Math.max(G.lv,REC.lv)};try{localStorage.setItem(KEY,JSON.stringify(REC))}catch(e){}}render();if(G.lv>=2)boom();return}
